name: vidpipe

# Local infrastructure: Kafka (KRaft), Kafka UI, S3-compatible store (RustFS), Postgres + pgvector.
# Start:  docker compose up -d      (run from local/infra, after copying .env.example to .env)
# Topics are NOT created here: run local/scripts/create_topics.py

# Shared settings of the worker containers (inside the compose network the services have their own
# hostnames, so the host-side values in .env, such as localhost:9092, are overridden here).
x-infra-ready: &infra-ready
  kafka: { condition: service_healthy }
  postgres: { condition: service_healthy }
  s3: { condition: service_started }

x-worker-env: &worker-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
  S3_BUCKET: ${S3_BUCKET:-vidpipe}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:-vidpipe}

x-worker: &worker
  profiles: [workers]
  restart: unless-stopped
  environment: *worker-env
  depends_on:
    <<: *infra-ready
    init: { condition: service_completed_successfully }

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: vidpipe-kafka
    ports:
      - "9092:9092"   # host listener (workers running on this machine)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = container-to-container (kafka:19092), EXTERNAL = host (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # a typo'd topic name must fail, not create a new topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: vidpipe-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  # S3-compatible object store. MinIO's images were removed from Docker Hub, so RustFS is used locally.
  # Services talk to it through the S3 API only (boto3 endpoint_url), so it can be swapped for AWS S3.
  # Bucket is created by local/scripts/init_storage.py. Layout by prefix: raw/, audio/, frames/
  s3:
    image: rustfs/rustfs:1.0.0-alpha.93
    container_name: vidpipe-s3
    command: /data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3_data:/data
    mem_limit: 512m

  postgres:
    image: pgvector/pgvector:pg17
    container_name: vidpipe-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vidpipe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # *.sql files here run once, on first start (schema DDL goes in local/sql)
      - ../sql:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------------------------
  # Pipeline workers, in containers (replaces one terminal per worker). Off by default:
  #   docker compose --profile workers up -d --build
  #   docker compose --profile workers up -d --scale vision-worker=3     # more vision workers
  # The first start downloads the Whisper and Florence-2 models into the `models` volume.
  # ---------------------------------------------------------------------------------------------

  # One-shot setup: topics, bucket, tables. Every worker waits for it to finish.
  init:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: light }
    image: vidpipe-light
    command: sh -c "python scripts/create_topics.py && python scripts/init_storage.py && python scripts/apply_sql.py"
    restart: "no"
    depends_on: *infra-ready

  # There is no downloader container: videos are fetched on your own machine with
  # `python scripts/ingest_video.py <url>` (your network, your yt-dlp), which stores the video and
  # announces it on video.stored. (The downloader worker still exists for scripts/submit_video.py.)

  frame-extractor:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: media }
    image: vidpipe-media
    command: python -m services.frame_extractor.worker

  audio-worker:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: media }
    image: vidpipe-media
    command: python -m services.audio_worker.worker
    environment:
      <<: *worker-env
      HF_HOME: /models/hf
    volumes:
      - models:/models

  vision-worker:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: vision }
    image: vidpipe-vision
    command: python -m services.vision_worker.worker
    environment:
      <<: *worker-env
      HF_HOME: /models/hf
    volumes:
      - models:/models

  chunk-builder:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: light }
    image: vidpipe-light
    command: python -m services.chunk_builder.worker

  timeline-builder:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: light }
    image: vidpipe-light
    command: python -m services.timeline_builder.worker

  embedder:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: embed }
    image: vidpipe-embed
    command: python -m services.embedder.worker
    environment:
      <<: *worker-env
      HF_HOME: /models/hf
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - models:/models

  # Needs Ollama on the host, listening on all interfaces: OLLAMA_HOST=0.0.0.0 ollama serve
  summarizer:
    <<: *worker
    build: { context: ../.., dockerfile: local/Dockerfile, target: light }
    image: vidpipe-light
    command: python -m services.summarizer.worker
    environment:
      <<: *worker-env
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kafka_data:
  s3_data:
  postgres_data:
  models:
